<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Gestionale Utenti</title>

    <style>

        body {
            font-family: Arial;
            margin: 30px;
        }

        table {
            border-collapse: collapse;
            width: 100%;
        }

        td, th {
            border: 1px solid #ccc;
            padding: 10px;
        }

        input {
            margin: 5px;
            padding: 5px;
        }

        button {
            padding: 5px 10px;
            margin: 3px;
        }

    </style>
</head>
<body>

<h1>Gestione Utenti</h1>

<h2>Nuovo Utente</h2>

<form id="userForm">

    <input type="hidden" id="userId">

    <input type="text" id="nome" placeholder="Nome" required>

    <input type="text" id="cognome" placeholder="Cognome" required>

    <input type="date" id="data_nascita" required>

    <input type="text" id="mansione" placeholder="Mansione" required>

    <button type="submit">Salva</button>

</form>

<hr>

<h2>Lista Utenti</h2>

<table>

    <thead>
        <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>Cognome</th>
            <th>Data nascita</th>
            <th>Mansione</th>
            <th>Azioni</th>
        </tr>
    </thead>

    <tbody id="userTableBody"></tbody>

</table>

<script src="/static/app.js"></script>

</body>
</html>
